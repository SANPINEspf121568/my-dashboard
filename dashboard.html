<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺经营看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--navy:#1e5aa8;--navy2:#2f6fc4;--navy-soft:#e8f0fb;--bg:#eef2f8;--card:#fff;--ink:#1f2937;--ink2:#64748b;
    --line:#e3e9f2;--ok:#1e7d46;--ok-soft:#e7f4ea;--ok-line:#9cc7a8;--warn:#b45309;--warn-soft:#fdf3e3;--warn-line:#e8c98a;
    --bad:#c0392b;--bad-soft:#fdecea;--bad-line:#e8b4ae;--viz1:#2f6fc4;--viz2:#c56443;--viz3:#8b9dc3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
  .wrap{max-width:1440px;margin:0 auto;padding:16px 18px 36px}

  /* ===== 顶栏 ===== */
  .topbar{background:linear-gradient(90deg,#174a8f,#2f6fc4 70%,#3d7fd4);color:#fff;border-radius:14px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(30,90,168,.25)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .brand h1{font-size:20px;font-weight:700}
  .brand p{font-size:12px;opacity:.85}
  .hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid;background:#fff;color:var(--ink2)}
  .badge.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  .badge.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}

  /* ===== 维度切换 ===== */
  .dimbar{display:flex;gap:6px;margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content;box-shadow:0 2px 8px rgba(30,90,168,.06)}
  .dim{border:none;background:transparent;padding:8px 22px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2);font-family:inherit}
  .dim.on{background:var(--navy);color:#fff}

  /* ===== 双窗口 ===== */
  .win{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 2px 10px rgba(30,90,168,.05)}
  .panel h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .panel h3 .hint{font-size:11px;font-weight:400;color:var(--ink2)}
  .mb{margin-bottom:16px}

  /* ===== KPI 卡 ===== */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy2);border-radius:11px;padding:11px 13px;box-shadow:0 2px 8px rgba(30,90,168,.05)}
  .kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}.kpi.ok{border-left-color:var(--ok)}
  .kpi .n{font-size:11px;color:var(--ink2);display:flex;align-items:center;justify-content:space-between}
  .kpi .v{font-size:24px;font-weight:700;margin-top:3px;color:var(--navy)}
  .kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
  .kpi .d{font-size:11px;margin-top:2px;color:var(--ink2)}
  .kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--bad)}

  /* ===== 图表 ===== */
  .ch{position:relative;height:235px}

  /* ===== 状态徽章 ===== */
  .mini{font-size:11px;padding:2px 9px;border-radius:6px;border:1px solid;white-space:nowrap}
  .mini.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .mini.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  .mini.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
  .mini.navy{background:var(--navy-soft);border-color:#bcd4f0;color:var(--navy)}

  /* ===== 排行条形 ===== */
  .rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12px}
  .rank-row:first-child{border-top:none}
  .rank-no{width:20px;height:20px;border-radius:6px;background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rank-row .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-bar{width:96px;height:8px;background:var(--bg);border-radius:99px;overflow:hidden;flex-shrink:0}
  .rank-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--navy2),#4d8fe0)}
  .rank-val{width:52px;text-align:right;font-weight:600;flex-shrink:0}

  /* ===== 必做清单 ===== */
  .todo-row{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px}
  .todo-row:first-child{border-top:none}
  .t-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .t-ico.bad{background:var(--bad-soft)}.t-ico.warn{background:var(--warn-soft)}.t-ico.ok{background:var(--ok-soft)}
  .todo-row .txt{flex:1;min-width:0}
  .todo-row .tag{font-size:11px;font-weight:600}

  /* ===== 表格 ===== */
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;color:var(--ink2);font-weight:600;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{font-size:12.5px;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.num,th.num{text-align:right}
  .cell-bad{color:var(--bad);font-weight:600}.cell-ok{color:var(--ok)}

  /* ===== 进度条 ===== */
  .prog-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:9px}
  .prog-row .name{width:118px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--navy2),#4d8fe0)}
  .pct{font-size:11px;color:var(--ink2);width:34px;text-align:right}

  /* ===== 运营日历 ===== */
  .cal-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
  .cal-row:first-child{border-top:none}
  .cal-date{width:52px;text-align:center;flex-shrink:0}
  .cal-date .m{font-size:10px;color:var(--ink2)}
  .cal-date .d{font-size:17px;font-weight:700;color:var(--navy)}
  .cal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .cal-dot.ok{background:var(--ok)}.cal-dot.warn{background:var(--warn)}.cal-dot.bad{background:var(--bad)}
  .cal-dot.navy{background:var(--navy2)}
  .cal-txt{flex:1;min-width:0}
  .cal-txt b{display:block;font-size:12.5px}
  .cal-txt span{font-size:11px;color:var(--ink2)}

  footer{margin-top:18px;font-size:11.5px;color:var(--ink2)}
  @media(max-width:1080px){.win{grid-template-columns:1fr}.ch{height:210px}}
</style>
</head>

            { icon:"✏️", text:"修改商品：1,019 个" },
            { icon:"📄", text:"已读 RFQ：15 条" },
            { icon:"📋", text:"起草订单：0 笔" },
            { icon:"👁️", text:"曝光 7,257 · 点击 114" }
          ]
        },
        liu: { name:"Liu Guoling", log:["本月暂无工作记录（曝光 0 · 询盘 0 · 上新 0）"] }
      },
      products: [
        { name:"LPG 加液机",          price:"$3,110",   view:370, click:1, inq:"—", status:"ok", statusText:"潜力优品" },
        { name:"LPG 输送泵 5.5KW",    price:"$4,040",   view:292, click:1, inq:"—", status:"ok", statusText:"潜力优品" },
        { name:"双枪加液机",          price:"$2,610",   view:216, click:0, inq:"—", status:"ok", statusText:"优品" },
        { name:"10m³ 撬装加注站",     price:"$14,850",  view:152, click:1, inq:"—", status:"ok", statusText:"潜力优品" }
      ],
      progress: [
        { name:"本月上新商品", pct:100 },
        { name:"本月修改商品", pct:100 }
      ]
    }
  }
};
</script>

<div class="wrap">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="logo" id="logo">豫</div>
      <div><h1 id="title">豫能实业 · 经营看板</h1><p id="subtitle"></p></div>
    </div>
    <div class="hright">
      <span class="badge" id="updated"></span>
      <span class="badge" id="health"></span>
    </div>
  </div>

  <!-- 维度切换 -->
  <div class="dimbar" id="dimTabs">
    <button class="dim on" data-dim="day">今日</button>
    <button class="dim" data-dim="week">本周</button>
    <button class="dim" data-dim="month">本月</button>
  </div>

  <!-- 双窗口 -->
  <div class="win">
    <!-- ============ 左窗口：店铺经营 ============ -->
    <div>
      <div class="kpis" id="kpis"></div>

      <div class="panel mb">
        <h3 id="trendTitle">曝光 / 搜索点击 趋势 <span class="hint">柱：曝光（左轴） · 线：搜索点击（右轴）</span></h3>
        <div class="ch"><canvas id="trend"></canvas></div>
      </div>

      <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="panel mb">
          <h3>P4P 投放数据 <span class="hint" id="p4pHint"></span></h3>
          <div id="p4pPanel"></div>
        </div>
        <div class="panel mb">
          <h3>本月商品排行 <span class="hint">按曝光</span></h3>
          <div id="rankList"></div>
        </div>
      </div>

      <div class="panel">
        <h3>今日必做 <span class="hint" id="todoHint"></span></h3>
        <div id="todos"></div>
      </div>
    </div>

    <!-- ============ 右窗口：商品与运营 ============ -->
    <div>
      <div class="panel mb">
        <h3>重点成员 · yuner hn 动作汇报 <span class="hint" id="teamHint"></span></h3>
        <div id="focusCard"></div>
        <h3 style="margin-top:14px">Liu Guoling · 工作日志 <span class="hint">每日做了什么</span></h3>
        <div id="liuCard"></div>
      </div>

      <div class="panel mb">
        <h3>关键商品指标 <span class="hint">按曝光排序</span></h3>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>商品</th><th class="num">价格</th><th class="num">曝光</th><th class="num">点击</th><th class="num">询盘</th><th>状态</th></tr></thead>
          <tbody id="prodBody"></tbody>
        </table></div>
      </div>

      <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="panel mb">
          <h3>内容与上新 <span class="hint" id="progHint"></span></h3>
          <div id="progList"></div>
        </div>
        <div class="panel mb">
          <h3>曝光来源占比 <span class="hint">环形图</span></h3>
          <div class="ch" style="height:170px"><canvas id="donut"></canvas></div>
        </div>
      </div>

      <div class="panel">
        <h3>运营节点日历 <span class="hint">Q3-Q4 · 行业通用节点</span></h3>
        <div id="calList"></div>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
(function(){
  var D = DATA, $ = function(id){ return document.getElementById(id); };
  var lv = { ok:['var(--ok-soft)','var(--ok-line)','var(--ok)'],
             warn:['var(--warn-soft)','var(--warn-line)','var(--warn)'],
             bad:['var(--bad-soft)','var(--bad-line)','var(--bad)'],
             navy:['var(--navy-soft)','#bcd4f0','var(--navy)'] };
  var chartTrend = null, chartDonut = null;

  // Header
  $('logo').textContent = (D.shop || '板').charAt(0);
  $('title').textContent = (D.shop || '') + ' · 经营看板';
  $('subtitle').textContent = (D.shopEn ? D.shopEn + ' · ' : '') + (D.dateNote || '');
  $('updated').textContent = '数据截至昨日 24:00 · ' + (D.updatedAt || '');
  if (D.health) { var h = $('health'); h.textContent = D.health.text; h.className = 'badge ' + (D.health.level || ''); }
  $('footer').textContent = '数据来源：阿里国际站数据参谋自动抓取 · 运营日历为行业通用节点，可按实际调整 · 需调指标或阈值直接告诉 Accio 助手';

  // KPI
  function renderKpis(kpis){
    $('kpis').innerHTML = kpis.map(function(k){
      return '<div class="kpi ' + (k.cls||'') + '"><div class="n">' + k.name + '</div>' +
             '<div class="v">' + k.value + '</div>' +
             '<div class="d">' + (k.delta||'') + '</div></div>';
    }).join('');
  }

  // P4P 面板
  function renderP4p(rows){
    $('p4pPanel').innerHTML = rows.map(function(r){
      var right = r.status ? '<span class="mini ' + r.status + '">' + r.value + '</span>'
                           : r.value + (r.note ? ' <span style="color:var(--ink2);font-weight:400">· ' + r.note + '</span>' : '');
      return '<div class="krow" style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px"><span style="color:var(--ink2)">' + r.label + '</span><span style="font-weight:600">' + right + '</span></div>';
    }).join('');
  }

  // 商品排行
  function renderRank(list){
    var max = list[0] ? list[0].val : 1;
    $('rankList').innerHTML = list.map(function(r){
      return '<div class="rank-row"><span class="rank-no">' + r.no + '</span>' +
        '<span class="rn">' + r.name + '</span>' +
        '<div class="rank-bar"><div class="rank-fill" style="width:' + r.bar + '%"></div></div>' +
        '<span class="rank-val">' + r.val + '</span></div>';
    }).join('');
  }

  // 必做清单
  function renderTodos(list){
    $('todos').innerHTML = list.map(function(f){
      var c = lv[f.level] || lv.warn;
      var ico = f.level==='bad' ? '🔴' : (f.level==='warn' ? '🟠' : '🟢');
      return '<div class="todo-row"><span class="t-ico ' + f.level + '">' + ico + '</span>' +
        '<div class="txt"><span class="tag" style="color:' + c[2] + '">' + f.tag + '</span> · ' + f.text + '</div></div>';
    }).join('');
  }

  // 重点成员 + 工作日志
  function renderTeam(team){
    if (!team) { $('tabTeam') && ($('tabTeam').style.display = 'none'); return; }
    var f = team.focus, st = f.status || 'ok';
    var stC = lv[st] || lv.ok;
    var card = '<div style="border:1px solid ' + stC[1] + ';background:' + stC[0] + ';border-radius:12px;padding:12px 14px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">' +
        '<div style="font-weight:700;font-size:15px">' + f.name + ' <span style="font-weight:400;color:var(--ink2);font-size:12px">· ' + (f.role||'') + '</span></div>' +
        '<span class="mini ' + st + '">' + (f.statusText||'') + '</span>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:10px">' +
        '<div class="kpi" style="border-left-color:var(--navy2)"><div class="n">询盘</div><div class="v" style="font-size:20px">' + f.stats.inq + '</div></div>' +
        '<div class="kpi" style="border-left-color:var(--navy2)"><div class="n">点击率</div><div class="v" style="font-size:20px">' + f.stats.ctr + '</div></div>' +
        '<div class="kpi ' + (f.stats.conv==='0%'?'bad':'') + '"><div class="n">转化</div><div class="v" style="font-size:20px">' + f.stats.conv + '</div></div>' +
        '<div class="kpi" style="border-left-color:var(--navy2)"><div class="n">平均回复</div><div class="v" style="font-size:20px">' + f.stats.reply + '</div></div>' +
      '</div>' +
      '<div style="font-size:12.5px">' + (f.actions||[]).map(function(a){
        return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(0,0,0,.06)"><span>' + a.icon + '</span><span>' + a.text + '</span></div>';
      }).join('') + '</div>' +
    '</div>';
    $('focusCard').innerHTML = card;

    var liu = team.liu;
    var liuHtml = (liu.log||[]).map(function(t, i){
      var c = /暂无/.test(t) ? lv.warn : lv.ok;
      return '<div class="todo-row"><span class="t-ico ' + (/暂无/.test(t)?'warn':'ok') + '">' + (/暂无/.test(t)?'🕐':'✅') + '</span>' +
        '<div class="txt"><span class="tag" style="color:' + c[2] + '">' + liu.name + '</span> · ' + t + '</div></div>';
    }).join('');
    $('liuCard').innerHTML = liuHtml || '<div class="todo-row"><span class="txt">今日暂无记录</span></div>';
  }

  // 商品表
  function renderProducts(rows){
    $('prodBody').innerHTML = rows.map(function(p){
      return '<tr><td>' + p.name + '</td><td class="num">' + p.price + '</td>' +
        '<td class="num">' + p.view + '</td><td class="num">' + p.click + '</td>' +
        '<td class="num ' + (p.inq>0?'cell-ok':'') + '">' + p.inq + '</td>' +
        '<td><span class="mini ' + p.status + '">' + p.statusText + '</span></td></tr>';
    }).join('');
  }

  // 上新进度
  function renderProg(rows){
    $('progList').innerHTML = rows.map(function(p){
      return '<div class="prog-row"><span class="name">' + p.name + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + p.pct + '%"></div></div>' +
        '<span class="pct">' + p.pct + '%</span></div>';
    }).join('');
  }

  // 运营日历
  function renderCal(){
    $('calList').innerHTML = D.calendar.map(function(c){
      var dot = c.cls;
      return '<div class="cal-row"><div class="cal-date"><div class="m">' + c.m + '</div><div class="d">' + c.d + '</div></div>' +
        '<span class="cal-dot ' + dot + '"></span>' +
        '<div class="cal-txt"><b>' + c.title + '</b><span>' + c.note + '</span></div></div>';
    }).join('');
  }

  // 维度切换
  function setDim(dim){
    var dd = D.dims[dim];
    document.querySelectorAll('#dimTabs .dim').forEach(function(t){
      t.classList.toggle('on', t.getAttribute('data-dim') === dim);
    });
    $('subtitle').textContent = dd.label + ' · ' + dd.sub + ' · ' + D.dateNote;
    $('p4pHint').textContent = dd.sub;
    $('todoHint').textContent = dd.sub;
    $('teamHint').textContent = dd.sub;
    $('progHint').textContent = dd.sub;

    renderKpis(dd.kpis);
    renderP4p(dd.p4p);
    renderRank(dd.rank);
    renderTodos(dd.todos);
    renderTeam(dd.team);
    renderProducts(dd.products);
    renderProg(dd.progress);

    // 趋势图
    if (dd.trend && window.Chart) {
      if (chartTrend) chartTrend.destroy();
      chartTrend = new Chart($('trend').getContext('2d'), {
        data: { labels: dd.trend.labels,
          datasets: [
            { type:'bar', label:'曝光', data:dd.trend.views, backgroundColor:'rgba(47,111,196,.55)', borderColor:'#2f6fc4', borderWidth:1, yAxisID:'y', order:2 },
            { type:'line', label:'搜索点击', data:dd.trend.clicks, borderColor:'#c56443', backgroundColor:'#c56443', borderWidth:2, pointRadius:2, tension:.3, yAxisID:'y1', order:1 }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
          plugins:{ legend:{position:'bottom', labels:{boxWidth:14,font:{size:12}}} },
          scales:{ x:{grid:{display:false},ticks:{font:{size:11},maxTicksLimit:10}},
                   y:{position:'left',grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:11}}},
                   y1:{position:'right',grid:{display:false},ticks:{font:{size:11}}} } }
      });
    }

    // 环形图
    if (dd.donut && window.Chart) {
      if (chartDonut) chartDonut.destroy();
      chartDonut = new Chart($('donut').getContext('2d'), {
        type:'doughnut',
        data:{ labels:dd.donut.labels, datasets:[{ data:dd.donut.data, backgroundColor:dd.donut.colors, borderWidth:2, borderColor:'#fff' }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
          plugins:{ legend:{position:'bottom', labels:{boxWidth:12,font:{size:11},padding:10}},
                    tooltip:{callbacks:{label:function(c){ return c.label + '：' + c.parsed.toLocaleString() + ' 曝光'; }}} } }
      });
    }
  }

  renderCal();
  setDim('day');
  document.querySelectorAll('#dimTabs .dim').forEach(function(t){
    t.addEventListener('click', function(){ setDim(t.getAttribute('data-dim')); });
  });
})();
</script>
</body>
