<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经营看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#f2f4f8;--card:#fff;--ink:#1f2937;--ink2:#6b7280;--line:#e5e8ee;--pri:#1f4e79;--pri-soft:#eaf0f7;
    --ok:#1e7d46;--ok-soft:#e7f4ea;--ok-line:#9cc7a8;--warn:#b45309;--warn-soft:#fdf3e3;--warn-line:#e8c98a;
    --bad:#c0392b;--bad-soft:#fdecea;--bad-line:#e8b4ae;--viz1:#3e7096;--viz2:#c56443;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px}
  .brand h1{font-size:19px;font-weight:600}
  .brand p{font-size:12px;color:var(--ink2)}
  .hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid;background:var(--card);border-color:var(--line);color:var(--ink2)}
  .badge.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  .badge.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .tabbar{display:flex;gap:6px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content}
  .tab{border:none;background:transparent;padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2);font-family:inherit}
  .tab.on{background:var(--pri);color:#fff;font-weight:500}
  .dimbar{display:flex;gap:4px;margin-bottom:14px}
  .dim{flex:1;max-width:150px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
  .dim:hover{border-color:var(--pri)}
  .dim.on{border-color:var(--pri);background:var(--pri-soft)}
  .dim .t{font-size:13px;font-weight:600;color:var(--ink)}
  .dim .s{font-size:11px;color:var(--ink2);margin-top:2px}
  .view{display:none}.view.on{display:block}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:12px;color:var(--ink2);display:flex;align-items:center;justify-content:space-between}
  .kpi .v{font-size:26px;font-weight:600;margin-top:4px}
  .kpi .d{font-size:12px;margin-top:3px;color:var(--ink2)}
  .kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--bad)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel h3{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .panel h3 .hint{font-size:11px;font-weight:400}
  .ch{position:relative;height:240px}
  .krow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .krow:first-child{border-top:none}
  .krow .l{color:var(--ink2)}.krow .r{font-weight:500}
  .mini{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid}
  .mini.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .mini.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  .mini.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
  .todo-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .todo-row:first-child{border-top:none}
  .todo-row .tag{flex-shrink:0;font-size:11px;padding:3px 9px;border-radius:6px;font-weight:500;border:1px solid}
  .todo-row .txt{flex:1;min-width:200px}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--ink2);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{font-size:13px;padding:10px;border-bottom:1px solid var(--line)}
  td.num,th.num{text-align:right}
  .cell-bad{color:var(--bad);font-weight:500}.cell-ok{color:var(--ok)}
  .prog-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:10px}
  .prog-row .name{width:130px;flex-shrink:0}
  .bar-track{flex:1;height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:var(--pri)}
  .pct{font-size:12px;color:var(--ink2);width:34px;text-align:right}
  footer{margin-top:18px;font-size:12px;color:var(--ink2)}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}.ch{height:200px}.dim{max-width:none}}
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" id="logo">板</div>

      <span class="badge" id="health"></span>
    </div>
  </header>

  <div class="tabbar" id="dimTabs">
    <button class="tab on" data-dim="day">今日</button>
    <button class="tab" data-dim="week">本周</button>
    <button class="tab" data-dim="month">本月</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-v="boss">老板视图 · 总览</button>
    <button class="tab" data-v="team" id="tabTeam">团队视图 · 分工</button>
  </div>

  <section class="view on" id="boss">
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="panel">
        <h3 id="trendTitle">曝光 / 询盘趋势 <span class="hint">柱：曝光（左轴） · 线：询盘（右轴）</span></h3>
        <div class="ch"><canvas id="trend"></canvas></div>
      </div>
      <div class="panel">
        <h3>投放健康度 <span class="hint" id="dimHint"></span></h3>
        <div id="healthPanel"></div>
      </div>
    </div>
    <div class="panel">
      <h3>必须处理 · 红灯事项 <span class="hint" id="flagCount"></span></h3>
      <div id="redFlags"></div>
    </div>
  </section>

  <section class="view" id="team">
    <div class="panel" style="margin-bottom:14px">
      <h3>业务员询盘处理 <span class="hint" id="memberHint"></span></h3>

        <thead><tr><th>业务员</th><th class="num">询盘</th><th class="num">平均回复</th><th class="num">跟进率</th><th class="num">转化率</th><th class="num">超时未回</th><th>状态</th></tr></thead>
        <tbody id="members"></tbody>

    </div>
    <div class="grid2">
      <div class="panel">
        <h3>重点商品表现 <span class="hint">有询盘商品</span></h3>

          <thead><tr><th>商品</th><th class="num">价格</th><th class="num">点击</th><th class="num">询盘</th><th>状态</th></tr></thead>

        <div id="progress"></div>
      </div>
    </div>
    <div class="panel">
      <h3>个人待办 <span class="hint">谁的红灯谁领走</span></h3>
      <div id="todos"></div>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

    $('subtitle').textContent = dd.label + ' · ' + dd.sub + ' · ' + D.dateNote;
    $('dimHint').textContent = dd.sub;
    $('memberHint').textContent = dd.sub;
    $('progressHint').textContent = dd.sub;
    renderBoss(dd);
    renderTeam(dd.team);
  }

  // 老板视图
  function renderBoss(dd){
    $('kpis').innerHTML = dd.kpis.map(function(k){
      return '<div class="kpi"><div class="n">' + k.name + ' <span class="dot ' + (k.status||'ok') + '"></span></div>' +
             '<div class="v">' + k.value + '</div>' +
             '<div class="d ' + (k.dir||'') + '">' + (k.delta||'') + '</div></div>';
    }).join('');

    $('healthPanel').innerHTML = dd.health_panel.map(function(r){
      var right = r.status ? '<span class="mini ' + r.status + '">' + r.value + '</span>'
                           : r.value + (r.note ? ' <span style="color:var(--ink2);font-weight:400">· ' + r.note + '</span>' : '');
      return '<div class="krow"><span class="l">' + r.label + '</span><span class="r">' + right + '</span></div>';
    }).join('');

    function flagRow(f){
      var c = lv[f.level] || lv.warn;
      return '<div class="todo-row"><span class="tag" style="background:' + c[0] + ';border-color:' + c[1] + ';color:' + c[2] + '">' +
             f.tag + '</span><span class="txt">' + f.text + '</span></div>';
    }
    $('redFlags').innerHTML = dd.redFlags.map(flagRow).join('');
    $('flagCount').textContent = dd.redFlags.length + ' 项 · 处理完自动熄灭';

    if (dd.trend && window.Chart) {
      if (chart) chart.destroy();
      chart = new Chart($('trend').getContext('2d'), {
        data: { labels: dd.trend.labels,
          datasets: [
            { type:'bar', label:'曝光', data:dd.trend.views, backgroundColor:'rgba(62,112,150,.55)', borderColor:'#3e7096', borderWidth:1, yAxisID:'y', order:2 },
            { type:'line', label:'询盘', data:dd.trend.inquiries, borderColor:'#c56443', backgroundColor:'#c56443', borderWidth:2, pointRadius:2, tension:.3, yAxisID:'y1', order:1 }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
          plugins:{ legend:{position:'bottom', labels:{boxWidth:14,font:{size:12}}} },
          scales:{ x:{grid:{display:false},ticks:{font:{size:11},maxTicksLimit:10}},
                   y:{position:'left',grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:11}}},
                   y1:{position:'right',grid:{display:false},ticks:{font:{size:11}}} } }
      });
    }
  }

  // 团队视图
  function renderTeam(t){
    if (!t) { $('tabTeam').style.display = 'none'; return; }
    $('tabTeam').style.display = '';
    $('members').innerHTML = t.members.map(function(m){
      return '<tr><td>' + m.name + '</td><td class="num">' + m.inq + '</td>' +
        '<td class="num ' + (m.status==='bad'?'cell-bad':'') + '">' + m.reply + '</td>' +
        '<td class="num ' + (m.status==='bad'?'cell-bad':'cell-ok') + '">' + m.follow + '</td>' +
        '<td class="num ' + (m.status==='bad'?'cell-bad':'cell-ok') + '">' + m.conv + '</td>' +
        '<td class="num ' + (m.overdue>0?'cell-bad':'') + '">' + m.overdue + '</td>' +
        '<td><span class="mini ' + m.status + '">' + m.statusText + '</span></td></tr>';
    }).join('');

    $('keywords').innerHTML = t.keywords.map(function(k){
      return '<tr><td>' + k.kw + '</td><td class="num">' + k.spend + '</td><td class="num">' + k.click + '</td>' +
        '<td class="num">' + k.inq + '</td>' +
        '<td><span class="mini ' + k.status + '">' + k.statusText + '</span></td></tr>';
    }).join('');

    $('progress').innerHTML = t.progress.map(function(p){
      return '<div class="prog-row"><span class="name">' + p.name + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + p.pct + '%"></div></div>' +
        '<span class="pct">' + p.pct + '%</span></div>';
    }).join('');

    var c0 = lv.bad, c1 = lv.warn;
    $('todos').innerHTML = t.todos.map(function(f){
      var c = lv[f.level] || lv.warn;
      return '<div class="todo-row"><span class="tag" style="background:' + c[0] + ';border-color:' + c[1] + ';color:' + c[2] + '">' +
             f.tag + '</span><span class="txt">' + f.text + '</span></div>';
    }).join('');
  }

  // 初始渲染 + 事件绑定
  setDim('day');
  document.querySelectorAll('#dimTabs .tab').forEach(function(t){
    t.addEventListener('click', function(){ setDim(t.getAttribute('data-dim')); });
  });
  document.querySelectorAll('#tabs .tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
      $(t.getAttribute('data-v')).classList.add('on');
    });
  });
})();
</script>
</body>
</html>
